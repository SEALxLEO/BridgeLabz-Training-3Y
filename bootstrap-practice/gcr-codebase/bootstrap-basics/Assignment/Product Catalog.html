<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; 
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Our Products</h2>
        <div class="row g-4">
            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=300&h=200" class="card-img-top" alt="Wireless Earbuds">
                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Earbuds</h5>
                        <p class="card-text text-primary fw-bold">$49.99</p>
                        <button class="btn btn-outline-primary w-100">Add to Cart</button>
                    </div>
                </div>
            </div>
            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?auto=format&fit=crop&w=300&h=200" class="card-img-top" alt="Gaming Laptop">
                    <div class="card-body text-center">
                        <h5 class="card-title">Gaming Laptop</h5>
                        <p class="card-text text-primary fw-bold">$999.00</p>
                        <button class="btn btn-outline-primary w-100">Add to Cart</button>
                    </div>
                </div>
            </div>
            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=300&h=200" class="card-img-top" alt="Mechanical Keyboard">
                    <div class="card-body text-center">
                        <h5 class="card-title">Mechanical Keyboard</h5>
                        <p class="card-text text-primary fw-bold">$89.99</p>
                        <button class="btn btn-outline-primary w-100">Add to Cart</button>
                    </div>
                </div>
            </div>
            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1579586337278-3befd40fd17a?auto=format&fit=crop&w=300&h=200" class="card-img-top" alt="Smartwatch">
                    <div class="card-body text-center">
                        <h5 class="card-title">Smartwatch</h5>
                        <p class="card-text text-primary fw-bold">$199.50</p>
                        <button class="btn btn-outline-primary w-100">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
