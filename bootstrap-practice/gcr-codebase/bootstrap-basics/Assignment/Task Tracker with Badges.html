<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Tasks <span class="badge bg-secondary fs-6 align-middle">3 Pending</span></h2>
            <!-- Button with embedded badge -->
            <button class="btn btn-success">
                Completed <span class="badge text-bg-light ms-1">12</span>
            </button>
        </header>

        <ul class="list-group shadow-sm">
            <!-- List item 1 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Finish Bootstrap Assignment
                <span class="badge bg-danger rounded-pill">High</span>
            </li>
            <!-- List item 2 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Review Node.js documentation
                <span class="badge bg-warning text-dark rounded-pill">Medium</span>
            </li>
            <!-- List item 3 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Renew Spotify Subscription
                <span class="badge bg-info text-dark rounded-pill">Low</span>
            </li>
        </ul>
    </div>
</body>
</html>
