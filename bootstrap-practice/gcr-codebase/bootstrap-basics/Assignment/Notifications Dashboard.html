<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-10 py-5">
    
    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">User Notifications</h4>
            </div>
            <div class="card-body">
                
                <!-- Success Alert -->
                <div class="alert alert-success" role="alert">
                    <strong>New Message!</strong> You have received a message from the admin.
                </div>

                <!-- Info Alert (Dismissible) -->
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    <strong>Pro Tip:</strong> Complete your profile to get more visibility.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Danger Alert -->
                <div class="alert alert-danger" role="alert">
                    <strong>Warning!</strong> Your subscription expires in 2 days.
                </div>

                <!-- Summary Well (Bootstrap 5 alternative to well) -->
                <div class="bg-light p-4 border rounded mt-4">
                    <h5>Account Summary</h5>
                    <p class="mb-0">You have 3 unread messages, 1 active warning, and your profile is 80% complete.</p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
