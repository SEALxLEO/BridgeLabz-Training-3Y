<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 border p-4 bg-light rounded">
        <h3 class="text-center mb-4">Article Navigation Layout</h3>
        
        <!-- Standard Pagination -->
        <nav aria-label="Blog post pagination">
            <ul class="pagination justify-content-center mb-4">
                <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Previous</a>
                </li>
                <li class="page-item active" aria-current="page"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>
            </ul>
        </nav>

        <!-- Simple Pager layout -->
        <div class="d-flex justify-content-between">
            <button class="btn btn-outline-secondary rounded-pill">&larr; Older Posts</button>
            <button class="btn btn-outline-secondary rounded-pill">Newer Posts &rarr;</button>
        </div>
    </div>
</body>
</html>
