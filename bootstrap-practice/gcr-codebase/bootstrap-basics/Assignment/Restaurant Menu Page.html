<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="text-center mt-5 mb-4">
        <h1>Today's Menu</h1>
        <p class="lead text-muted">Fresh ingredients, expertly prepared.</p>
    </header>

    <main class="container">
        <div class="row">
            <div class="col-lg-8">
                <h3 class="mb-3">Main Courses</h3>
                <table class="table table-hover table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Grilled Salmon</td>
                            <td>Seafood</td>
                            <td>$24.00</td>
                        </tr>
                        <tr>
                            <td>Truffle Risotto</td>
                            <td>Vegetarian</td>
                            <td>$18.50</td>
                        </tr>
                        <tr>
                            <td>Ribeye Steak</td>
                            <td>Meat</td>
                            <td>$32.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="col-lg-4">
                <h3 class="mb-3">Chef's Specials</h3>
                <ul class="list-group mb-4">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Lobster Bisque
                        <span class="badge bg-danger rounded-pill">Hot</span>
                    </li>
                    <li class="list-group-item">Wagyu Beef Burger</li>
                    <li class="list-group-item">Vegan Chocolate Tart</li>
                </ul>

                <!-- Live restaurant kitchen image -->
                <figure class="figure">
                    <img src="https://images.unsplash.com/photo-1556156653-e5a7c69cc263?auto=format&fit=crop&w=800&h=500" class="figure-img img-fluid rounded shadow-sm" alt="Chef preparing food in kitchen">
                    <figcaption class="figure-caption text-center mt-2">Our award-winning kitchen in action.</figcaption>
                </figure>
            </div>
        </div>
    </main>
</body>
</html>
