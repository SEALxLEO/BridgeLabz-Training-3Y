<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>
    <h1 title="SJS Public School - Report Card">SJS Public School</h1>
    
    <h2>Term 1 Student Report Card</h2>

    <!-- Marks table for 5 subjects -->
    <table border="1">
        <tr>
            <th title="Subject Category">Category</th>
            <th title="Name of the Subject">Subject</th>
            <th title="Marks Obtained by Student">Marks Obtained</th>
            <th title="Maximum Possible Marks">Max Marks</th>
        </tr>
        
        <tr>
            <td rowspan="3">Core</td>
            <td>Mathematics</td>
            <td>85</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>90</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
            <td>100</td>
        </tr>

        <tr>
            <td rowspan="2">Language</td>
            <td>English</td>
            <td>88</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Hindi</td>
            <td>92</td>
            <td>100</td>
        </tr>

        <tr>
            <th colspan="2">Total</th>
            <th>450</th>
            <th>500</th>
        </tr>
        
        <tr>
            <th colspan="2">Percentage</th>
            <th colspan="2" title="Overall Grade Percentage">90%</th>
        </tr>
    </table>

</body>
</html>
