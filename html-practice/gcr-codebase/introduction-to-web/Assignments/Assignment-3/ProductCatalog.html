<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta and title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
</head>
<body>

    <!-- Store Heading -->
    <h2>My Online Store</h2>

    <!-- Product Table -->
    <table border="1">
        
        <!-- Table Headers -->
        <tr>
            <th>Category</th>
            <th>Image</th>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <!-- Colspan example: spans across all 6 columns -->
        <tr>
            <th colspan="6">Electronics Sale</th>
        </tr>

        <!-- Rowspan example: category covers 2 rows -->
        <tr>
            <td rowspan="2">Smartphones</td>
            <td><img src="https://img-prd-pim.poorvika.com/cdn-cgi/image/format=auto,quality=75/product/Oppo-find-x9-ultra-5g-tundra-umber-12gb-512gb-Front-Back-View.webp" alt="Smartphone" width="80"></td>
            <td>Oppo Find X9 Ultra</td>
            <td>Best Camera Smartphone.</td>
            <td>₹169999</td>
            <td>In Stock</td>
        </tr>
        
        <!-- Second product in the smartphone category -->
        <tr>
            <td><img src="https://cdn.thewirecutter.com/wp-content/media/2026/02/BEST-BUDGET-ANDROID-PHONES-2048px-09454-3x2-1.jpg?auto=webp&quality=75&crop=1:1,smart&width=1024" alt="Budget Phone" width="80"></td>
            <td>Samsumg Galaxy</td>
            <td>Affordable Smartphone.</td>
            <td>₹15000</td>
            <td>Out of Stock</td>
        </tr>

    </table>

</body>
</html>
