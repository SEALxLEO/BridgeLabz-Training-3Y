<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Iframe Target</title>
</head>
<body>
    <!-- The form's target attribute matches the iframe's name attribute so the result loads inside the iframe -->
    <form action="result.html" method="get" target="result_frame">
        <label for="textInput">Enter text:</label>
        <input type="text" id="textInput" name="textInput" required>
        <input type="submit" value="Submit">
    </form>
    
    <br><br>
    
    <!-- Iframe that will display result.html upon form submission -->
    <iframe name="result_frame" width="400" height="200" title="Submission Result"></iframe>
</body>
</html>
