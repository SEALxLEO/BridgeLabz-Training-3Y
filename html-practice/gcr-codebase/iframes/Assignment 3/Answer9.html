<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Form</title>
</head>
<body>
    <!-- enctype="multipart/form-data" is required for forms that upload files -->
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="fileUpload">Upload Image:</label>
        <input type="file" id="fileUpload" name="fileUpload" accept=".jpg, .png" required><br><br>
        
        <p>Note: Only .jpg and .png file formats are allowed for upload.</p>
        
        <input type="submit" value="Upload File">
    </form>
</body>
</html>
