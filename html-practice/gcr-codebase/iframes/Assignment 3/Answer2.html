<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map Embed</title>
</head>
<body>
    <!-- The loading="lazy" attribute defers loading the iframe until it reaches the user's viewport, improving page load speed -->
    <iframe 
        src="https://maps.google.com/maps?q=GLA%20University,%20Mathura&t=&z=13&ie=UTF8&iwloc=&output=embed" 
        width="600" 
        height="450" 
        title="Map of GLA University" 
        loading="lazy">
    </iframe>
</body>
</html>
