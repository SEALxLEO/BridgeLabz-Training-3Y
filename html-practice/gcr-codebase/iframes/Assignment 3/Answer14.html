<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Website Iframe</title>
</head>
<body>
    <!-- Embedding an external website using the iframe tag -->
    <iframe src="https://www.wikipedia.org" width="800" height="500" title="Wikipedia Homepage"></iframe>
    
    <!-- Explanatory paragraph about security restrictions -->
    <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
