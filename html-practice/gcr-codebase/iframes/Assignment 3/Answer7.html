<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Devang Kumar">
    <title>Login Form</title>
</head>
<body>
    <form action="#" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        
        <!-- A CSRF (Cross-Site Request Forgery) token is a unique, secret value generated by the server. It is used to verify that the authenticated user is the one actually making the request, preventing malicious third-party sites from submitting forged requests on the user's behalf. -->
        <input type="hidden" name="csrf_token" value="dummy_token_abc123">
        
        <input type="submit" value="Login">
    </form>
</body>
</html>
