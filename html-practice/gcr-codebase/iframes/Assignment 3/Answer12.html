<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <!-- Using HTML entities to display reserved characters and symbols so the browser doesn't interpret them as code -->
    <p>
        Less than symbol: &lt; <br>
        Greater than symbol: &gt; <br>
        Ampersand: &amp; <br>
        Double quote: &quot; <br>
        Single quote: &apos; <br>
        Trademark symbol: &trade; <br>
        Copyright symbol: &copy; <br>
        Registered symbol: &reg;
    </p>
</body>
</html>
