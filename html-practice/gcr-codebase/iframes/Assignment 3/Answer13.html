<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The meta charset="UTF-8" tag ensures proper rendering of characters from all languages -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language Webpage</title>
</head>
<body>
    <p><strong>English:</strong> Hello, welcome to my website.</p>
    
    <p><strong>Hindi:</strong> नमस्ते, मेरी वेबसाइट पर आपका स्वागत है।</p>
    
    <p><strong>French:</strong> Bonjour, bienvenue sur mon site web.</p>
</body>
</html>
