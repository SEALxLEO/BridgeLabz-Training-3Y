<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Photo Gallery</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>
    <!-- The gallery container holding 6 images[cite: 1] -->
    <main class="gallery-container">
        
        <!-- Image 1 with semantic figure and figcaption -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0" alt="Landscape 1">
            <figcaption class="caption">Mountain Horizon</figcaption>
        </figure>

        <!-- Image 2 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e" alt="Landscape 2">
            <figcaption class="caption">Lush Valley</figcaption>
        </figure>

        <!-- Image 3 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07" alt="Landscape 3">
            <figcaption class="caption">Deep Forest</figcaption>
        </figure>

        <!-- Image 4 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Landscape 4">
            <figcaption class="caption">Misty Morning</figcaption>
        </figure>

        <!-- Image 5 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff" alt="Landscape 5">
            <figcaption class="caption">Serene Lake</figcaption>
        </figure>

        <!-- Image 6 -->
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d" alt="Landscape 6">
            <figcaption class="caption">Autumn Woods</figcaption>
        </figure>

    </main>
</body>
</html>
