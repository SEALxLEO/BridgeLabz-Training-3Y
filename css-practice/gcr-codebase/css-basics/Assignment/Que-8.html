<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style8.css">
</head>
<body>
    <!-- Header section at the top with a fixed position[cite: 1] -->
    <header class="dashboard-header">
        <h2>Admin Dashboard</h2>
    </header>

    <div class="dashboard-wrapper">
        <!-- Sidebar on the left containing navigation links[cite: 1] -->
        <aside class="sidebar">
            <nav>
                <a href="#">Overview</a>
                <a href="#">Analytics</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main content area on the right with at least two content boxes[cite: 1] -->
        <main class="main-content">
            <div class="content-box">
                <h3>Sales Data</h3>
                <p>Metrics for the current quarter.</p>
            </div>
            <div class="content-box">
                <h3>User Activity</h3>
                <p>Recent logins and engagement stats.</p>
            </div>
        </main>
    </div>
</body>
</html>
