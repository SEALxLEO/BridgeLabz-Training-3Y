<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and Grid Layout</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body>
    <!-- Header using Flexbox[cite: 2] -->
    <header class="main-header">
        <div class="logo">Devang's Layout</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Articles</a>
        </nav>
    </header>

    <!-- Main 2-column Grid[cite: 2] -->
    <main class="main-layout">
        <article class="article-content">
            <!-- Animated title[cite: 2] -->
            <h1 class="animated-title">Responsive Web Design</h1>
            <p>Combining the power of CSS Grid and Flexbox for modern layouts.</p>
            
            <!-- 3 boxes aligned using Flexbox[cite: 2] -->
            <div class="flex-boxes">
                <div class="box">Design</div>
                <div class="box">Code</div>
                <div class="box">Deploy</div>
            </div>
        </article>

        <!-- Sidebar[cite: 2] -->
        <aside class="sidebar">
            <h3>Recent Posts</h3>
            <p>Updates on web development.</p>
        </aside>
    </main>

    <!-- Full width footer with centered text[cite: 2] -->
    <footer class="main-footer">
        <p>&copy; 2026 Combined Layout Project</p>
    </footer>
</body>
</html>
