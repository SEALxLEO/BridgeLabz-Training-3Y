<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Photo Gallery</title>
    <link rel="stylesheet" href="style8.css">
</head>
<body>
    <!-- Gallery container[cite: 2] -->
    <main class="photo-gallery">
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e" alt="Nature 1">
            <!-- Image captions using <figcaption>[cite: 2] -->
            <figcaption>Lush Valley</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07" alt="Nature 2">
            <figcaption>Deep Forest</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Nature 3">
            <figcaption>Misty Morning</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d" alt="Nature 4">
            <figcaption>Autumn Woods</figcaption>
        </figure>
    </main>
</body>
</html>
