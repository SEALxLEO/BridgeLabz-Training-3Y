<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="style9.css">
</head>
<body>
    <!-- Centered on screen using Flexbox[cite: 2] -->
    <div class="card-container">
        <!-- Inner wrapper for 3D context[cite: 2] -->
        <div class="card-inner">
            
            <!-- Front side: shows title and image[cite: 2] -->
            <div class="card-face card-front">
                <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97" alt="Coding">
                <h2>Web Development</h2>
            </div>
            
            <!-- Back side: shows text description[cite: 2] -->
            <div class="card-face card-back">
                <p>Mastering CSS Grid, Flexbox, and advanced 3D transformations to build modern interfaces.</p>
            </div>
            
        </div>
    </div>
</body>
</html>
