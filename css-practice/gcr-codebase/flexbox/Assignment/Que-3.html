<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Section Homepage</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <!-- Header with navigation links[cite: 2] -->
    <header class="main-header">
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Portfolio</a>
            <a href="#">Blog</a>
        </nav>
    </header>

    <!-- Main area with three horizontally aligned boxes[cite: 2] -->
    <main class="content-area">
        <div class="box">
            <h2>Services</h2>
            <p>Web development and design.</p>
        </div>
        <div class="box">
            <h2>Projects</h2>
            <p>Our recent client work.</p>
        </div>
        <div class="box">
            <h2>Contact</h2>
            <p>Get in touch with us.</p>
        </div>
    </main>

    <!-- Footer spanning full width[cite: 2] -->
    <footer class="main-footer">
        <p>&copy; 2026 3-Section Flexbox Layout</p>
    </footer>
</body>
</html>
