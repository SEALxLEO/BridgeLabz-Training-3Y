<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Blog Layout</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>
    <div class="grid-container">
        <!-- Header with title and nav links[cite: 2] -->
        <header class="header">
            <h1>Devang's Blog</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
            </nav>
        </header>

        <!-- Sidebar on the left[cite: 2] -->
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul>
                <li><a href="#">Web Dev</a></li>
                <li><a href="#">Node.js</a></li>
                <li><a href="#">CSS Grid</a></li>
            </ul>
        </aside>

        <!-- Main displaying two blog posts side-by-side[cite: 2] -->
        <main class="main-content">
            <article class="post">
                <h2>Post One</h2>
                <p>Understanding the basics of Grid layout.</p>
            </article>
            <article class="post">
                <h2>Post Two</h2>
                <p>Mastering Flexbox properties.</p>
            </article>
        </main>

        <!-- Footer with contact info[cite: 2] -->
        <footer class="footer">
            <p>Contact info: devang@example.com</p>
        </footer>
    </div>
</body>
</html>
