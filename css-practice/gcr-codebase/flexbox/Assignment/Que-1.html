<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header: name (left) and navigation links (right)[cite: 2] -->
    <header class="portfolio-header">
        <div class="logo">Devang Kumar</div>
        <nav>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main area: two sections side-by-side[cite: 2] -->
    <main class="portfolio-main">
        <section class="about-me">
            <h2>About Me</h2>
            <p>Hello! I am a full-stack web development student focusing on Node.js, HTML, CSS, and version control. I enjoy building responsive layouts and working with modern web technologies.</p>
        </section>
        <section class="image-section">
            <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97" alt="Coding Workspace">
        </section>
    </main>

    <!-- Footer: simple copyright text centered[cite: 2] -->
    <footer class="portfolio-footer">
        <p>&copy; 2026 Devang Kumar. All rights reserved.</p>
    </footer>
</body>
</html>
