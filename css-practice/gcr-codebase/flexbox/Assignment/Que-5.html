<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Pricing Section</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
    <!-- Three pricing cards aligned horizontally[cite: 2] -->
    <section class="pricing-container">
        
        <div class="card">
            <h3>Basic</h3>
            <p class="price">$10 / mo</p>
        </div>

        <!-- Middle card highlighted[cite: 2] -->
        <div class="card highlighted">
            <h3>Standard</h3>
            <p class="price">$25 / mo</p>
        </div>

        <div class="card">
            <h3>Premium</h3>
            <p class="price">$50 / mo</p>
        </div>

    </section>
</body>
</html>
