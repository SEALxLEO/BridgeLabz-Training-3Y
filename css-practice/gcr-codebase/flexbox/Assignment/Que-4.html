<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dashboard Layout</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Header spans top[cite: 2] -->
        <header class="header">
            <h2>Admin Dashboard</h2>
        </header>

        <!-- Sidebar with vertical navigation[cite: 2] -->
        <aside class="sidebar">
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Analytics</a>
                <a href="#">Users</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main content with 4 boxes[cite: 2] -->
        <main class="main-content">
            <div class="box box-span">
                <h3>Main Overview</h3>
                <p>Spans two columns.</p>
            </div>
            <div class="box">
                <h3>Stats 1</h3>
            </div>
            <div class="box">
                <h3>Stats 2</h3>
            </div>
            <div class="box">
                <h3>System Status</h3>
            </div>
        </main>
    </div>
</body>
</html>
