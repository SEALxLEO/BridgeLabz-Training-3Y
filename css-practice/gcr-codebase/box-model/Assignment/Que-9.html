<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="style9.css">
</head>
<body>
    <main class="form-container">
        <h2>Send a Message</h2>
        
        <!-- Small form with input and textarea elements[cite: 3] -->
        <form class="styled-form">
            
            <div class="form-group">
                <label for="name">Name (Dashed Outline Demo)</label>
                <input type="text" id="name" class="demo-dashed" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="message">Message (Double Outline Demo)</label>
                <textarea id="message" rows="5" class="demo-double" placeholder="Type your message here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Form</button>
            
        </form>
    </main>
</body>
</html>
