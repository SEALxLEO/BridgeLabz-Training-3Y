<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <!-- Fixed header[cite: 3] -->
    <header class="fixed-header">
        <h1>Gradient Layout</h1>
    </header>

    <main>
        <!-- Linear gradient section[cite: 3] -->
        <section class="linear-section">
            <h2>Linear Gradient</h2>
            <p>This section transitions smoothly from top-left to bottom-right using a linear gradient.</p>
        </section>

        <!-- Radial gradient section with parallax[cite: 3] -->
        <section class="radial-section">
            <h2>Radial Gradient</h2>
            <p>This section uses a radial gradient originating from the center with a fixed background attachment for a parallax effect.</p>
        </section>
    </main>

    <!-- Fixed footer[cite: 3] -->
    <footer class="fixed-footer">
        <p>&copy; 2026 Gradient Showcase</p>
    </footer>
</body>
</html>
