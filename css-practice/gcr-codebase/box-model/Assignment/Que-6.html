<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>
    <!-- Horizontal flex container[cite: 3] -->
    <main class="transform-container">
        
        <!-- Rotate demo[cite: 3] -->
        <section class="demo-item">
            <div class="box box-rotate"></div>
            <p>rotate(45deg)</p>
        </section>

        <!-- Scale demo[cite: 3] -->
        <section class="demo-item">
            <div class="box box-scale"></div>
            <p>scale(1.2)</p>
        </section>

        <!-- Translate demo[cite: 3] -->
        <section class="demo-item">
            <div class="box box-translate"></div>
            <p>translate(0, -20px)</p>
        </section>

        <!-- Skew demo[cite: 3] -->
        <section class="demo-item">
            <div class="box box-skew"></div>
            <p>skew(20deg, 10deg)</p>
        </section>

    </main>
</body>
</html>
