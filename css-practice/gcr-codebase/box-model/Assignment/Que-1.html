<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Semantic header tag[cite: 3] -->
    <header>
        <h1>Borders and Padding Showcase</h1>
    </header>

    <!-- Semantic main tag[cite: 3] -->
    <main>
        <!-- Section acting as a Flexbox container[cite: 3] -->
        <section class="box-container">
            
            <!-- Box 1: Solid border, basic padding, small border-radius[cite: 3] -->
            <div class="demo-box box-solid">
                <h2>Solid Border</h2>
                <p>Padding: 15px | Radius: 5px</p>
            </div>

            <!-- Box 2: Dashed border, larger padding, medium border-radius[cite: 3] -->
            <div class="demo-box box-dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 25px | Radius: 15px</p>
            </div>

            <!-- Box 3: Double border, varied padding, large border-radius[cite: 3] -->
            <div class="demo-box box-double">
                <h2>Double Border</h2>
                <p>Padding: 35px | Radius: 25px</p>
            </div>

            <!-- Box 4: Groove border, massive padding, circular border-radius[cite: 3] -->
            <div class="demo-box box-groove">
                <h2>Groove Border</h2>
                <p>Padding: 45px | Radius: 50%</p>
            </div>

        </section>
    </main>

    <!-- Semantic footer tag[cite: 3] -->
    <footer>
        <p>&copy; 2026 CSS Box Model Demonstration</p>
    </footer>
</body>
</html>
