<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="Filter_Cards_with_Animation.css">
</head>
<body>
    <main class="profile-container">
        <!-- Profile Card 1 -->
        <article class="profile-card">
            <!-- Using real placeholder images -->
            <img src="https://picsum.photos/id/1005/150/150" alt="User A Profile">
            <h2>User A</h2>
            <p>Web Developer</p>
        </article>
        
        <!-- Profile Card 2 -->
        <article class="profile-card">
            <img src="https://picsum.photos/id/1011/150/150" alt="User B Profile">
            <h2>User B</h2>
            <p>UX Designer</p>
        </article>
        
        <!-- Profile Card 3 -->
        <article class="profile-card">
            <img src="https://picsum.photos/id/1012/150/150" alt="User C Profile">
            <h2>User C</h2>
            <p>Project Manager</p>
        </article>
    </main>
</body>
</html>
