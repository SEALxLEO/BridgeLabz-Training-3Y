<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="Filter_Comparison_Layout.css">
</head>
<body>
    <h2 style="text-align: center; margin-top: 2rem;">CSS Filter Comparison</h2>
    <main class="comparison-container">
        <figure>
            <img src="https://picsum.photos/id/1025/500/350" alt="Original Dog Image">
            <figcaption>Original Image</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1025/500/350" alt="Filtered Dog Image" class="applied-filter">
            <figcaption>Contrast & Sepia (Hover to remove)</figcaption>
        </figure>
    </main>
</body>
</html>
