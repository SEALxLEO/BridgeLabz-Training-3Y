<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive_Image_Filter_Gallery.css">
</head>
<body>
    <header>
        <h1>CSS Filter Gallery</h1>
    </header>
    <main>
        <section class="gallery-grid">
            <figure>
                <img src="https://picsum.photos/id/1015/300/300" alt="Blur" class="filter-blur">
                <figcaption>Blur Filter</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1016/300/300" alt="Grayscale" class="filter-grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1018/300/300" alt="Sepia" class="filter-sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1019/300/300" alt="Brightness" class="filter-brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1021/300/300" alt="Contrast" class="filter-contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos/id/1022/300/300" alt="Hue Rotate" class="filter-hue">
                <figcaption>Hue Rotate Filter</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
