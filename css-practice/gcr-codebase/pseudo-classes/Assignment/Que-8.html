<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Sizing Comparison Page</title>
    <link rel="stylesheet" href="style8.css">
</head>
<body>
    <!-- Centered main container[cite: 2] -->
    <main class="container">
        
        <!-- Descriptive text[cite: 2] -->
        <header class="description">
            <h2>Box-Sizing Comparison</h2>
            <p>With the default <strong>content-box</strong>, padding and borders expand the total size. With <strong>border-box</strong>, the declared width absorbs the padding and borders, keeping the element exactly that size.</p>
        </header>

        <!-- Two boxes side by side[cite: 2] -->
        <section class="boxes-wrapper">
            
            <div class="demo-box box-content">
                <h3>content-box</h3>
                <p>(Default)</p>
            </div>

            <div class="demo-box box-border">
                <h3>border-box</h3>
                <p>(Constrained)</p>
            </div>

        </section>

    </main>
</body>
</html>
