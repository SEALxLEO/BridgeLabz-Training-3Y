<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini UI Layout</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body class="layout-wrapper">
    <!-- Header[cite: 2] -->
    <header class="ui-header">
        <h1>Welcome Back</h1>
    </header>

    <!-- Main content card[cite: 2] -->
    <main class="ui-card">
        <!-- Small image[cite: 2] -->
        <img src="https://via.placeholder.com/80" alt="Avatar" class="avatar-img">
        
        <!-- Form and buttons[cite: 2] -->
        <form class="ui-form">
            <input type="text" placeholder="Username" class="ui-input" required>
            <input type="password" placeholder="Password" class="ui-input" required>
            <button type="submit" class="ui-btn">Sign In</button>
            <button type="button" class="ui-btn ui-btn-outline">Register</button>
        </form>
    </main>

    <!-- Footer[cite: 2] -->
    <footer class="ui-footer">
        <p>&copy; 2026 Mini UI</p>
    </footer>
</body>
</html>
