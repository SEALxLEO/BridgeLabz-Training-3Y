<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <!-- Center all examples using Flexbox[cite: 2] -->
    <main class="content-wrapper">
        
        <!-- Multiple elements with tooltips[cite: 2] -->
        <div class="tooltip-container">
            Hover Text
            <span class="tooltip-text">I am a text tooltip!</span>
        </div>

        <div class="tooltip-container">
            Hover Button
            <span class="tooltip-text">Clicking does nothing!</span>
        </div>

        <div class="tooltip-container">
            Hover Icon ℹ️
            <span class="tooltip-text">Helpful information here!</span>
        </div>

    </main>
</body>
</html>
