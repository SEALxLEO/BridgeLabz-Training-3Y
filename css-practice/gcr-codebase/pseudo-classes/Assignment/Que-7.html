<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components Page</title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>
    <!-- Card container[cite: 2] -->
    <main class="ui-card">
        <h2>Dashboard Settings</h2>
        
        <!-- Search bar[cite: 2] -->
        <input type="text" class="ui-search" placeholder="Search settings...">
        
        <!-- Dropdown menu[cite: 2] -->
        <select class="ui-dropdown">
            <option value="profile">Profile</option>
            <option value="security">Security</option>
            <option value="notifications">Notifications</option>
        </select>

        <!-- Buttons[cite: 2] -->
        <div class="btn-group">
            <button class="ui-btn btn-save">Save</button>
            <button class="ui-btn btn-cancel">Cancel</button>
        </div>
    </main>
</body>
</html>
