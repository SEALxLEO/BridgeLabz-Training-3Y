<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <header class="page-header">
        <h1>Gallery Showcase</h1>
    </header>

    <!-- Display six images using Grid[cite: 2] -->
    <main class="image-grid">
        
        <!-- Image Item 1 -->
        <figure class="grid-item">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1506744626753-140283b2db25" alt="Landscape 1">
                <div class="overlay"></div>
            </div>
            <!-- Short captions[cite: 2] -->
            <figcaption>Mountain Valley</figcaption>
        </figure>

        <!-- Image Item 2 -->
        <figure class="grid-item">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e" alt="Landscape 2">
                <div class="overlay"></div>
            </div>
            <figcaption>Lush Hills</figcaption>
        </figure>

        <!-- Image Item 3 -->
        <figure class="grid-item">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07" alt="Landscape 3">
                <div class="overlay"></div>
            </div>
            <figcaption>Deep Forest</figcaption>
        </figure>

        <!-- Image Item 4 -->
        <figure class="grid-item">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Landscape 4">
                <div class="overlay"></div>
            </div>
            <figcaption>Misty Morning</figcaption>
        </figure>

        <!-- Image Item 5 -->
        <figure class="grid-item">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d" alt="Landscape 5">
                <div class="overlay"></div>
            </div>
            <figcaption>Autumn Woods</figcaption>
        </figure>

        <!-- Image Item 6 -->
        <figure class="grid-item">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97" alt="Coding">
                <div class="overlay"></div>
            </div>
            <figcaption>Tech Setup</figcaption>
        </figure>

    </main>
</body>
</html>
