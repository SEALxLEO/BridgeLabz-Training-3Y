<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Live Search</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f3f4f6; color: #111827; padding: 32px 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 18px; font-size: 26px; text-align: center; }
    .search-box { width: 100%; padding: 14px 16px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; background: #ffffff; }
    .search-box:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    #loading { display: none; text-align: center; margin: 18px 0; color: #2563eb; font-weight: bold; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #bfdbfe; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #results { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .card { background: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
    .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card-body { padding: 14px; }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
    .card-price { font-size: 15px; color: #059669; font-weight: bold; }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 32px; background: #ffffff; border-radius: 10px; color: #6b7280; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Real-Time Product Live Search</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Search products by name...">
    <div id="loading"><span class="spinner"></span>Loading products...</div>
    <div id="results"></div>
  </div>

  <script>
    $(document).ready(function () {
      const API_URL = "http://localhost:3001/products";
      let currentRequest = null;

      function renderProducts(products) {
        const $results = $("#results");
        $results.empty();

        if (!products || products.length === 0) {
          $results.html('<div class="empty-state">No products found</div>');
          return;
        }

        products.forEach(function (product) {
          const card = `
            <div class="card">
              <img src="${product.image}" alt="${product.name}">
              <div class="card-body">
                <div class="card-title">${product.name}</div>
                <div class="card-price">₹${Number(product.price).toLocaleString("en-IN")}</div>
              </div>
            </div>
          `;
          $results.append(card);
        });
      }

      function fetchProducts(query) {
        if (currentRequest) {
          currentRequest.abort();
        }

        currentRequest = $.ajax({
          url: API_URL + "?q=" + encodeURIComponent(query),
          method: "GET",
          dataType: "json",
          beforeSend: function () {
            $("#loading").show();
          },
          success: function (data) {
            renderProducts(data);
          },
          error: function (xhr, status) {
            if (status !== "abort") {
              $("#results").html('<div class="empty-state">Failed to fetch products. Ensure JSON Server is running on port 3001.</div>');
            }
          },
          complete: function () {
            $("#loading").hide();
          }
        });
      }

      $("#searchInput").on("input", function () {
        const value = $(this).val().trim();
        fetchProducts(value);
      });

      fetchProducts("");
    });
  </script>
</body>
</html>
