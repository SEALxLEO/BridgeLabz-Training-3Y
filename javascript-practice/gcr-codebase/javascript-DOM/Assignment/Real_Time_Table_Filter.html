<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Table Filter</title></head>
<body><input id="search" placeholder="Search"><p id="none" hidden>No results found</p>
<table border="1"><tbody id="students">
<tr><td>Devang</td><td>CSE</td><td>8.2</td></tr><tr><td>Rahul</td><td>ECE</td><td>7.8</td></tr>
<tr><td>Ankit</td><td>CSE</td><td>8.7</td></tr><tr><td>Priya</td><td>IT</td><td>9.1</td></tr>
</tbody></table>
<script>
const rows=document.querySelectorAll("#students tr");
search.oninput=()=>{
    let found=0,q=search.value.toLowerCase();
    rows.forEach(row=>{const ok=row.textContent.toLowerCase().includes(q);row.hidden=!ok;if(ok)found++});
    none.hidden=found!==0;
};
</script></body></html>
