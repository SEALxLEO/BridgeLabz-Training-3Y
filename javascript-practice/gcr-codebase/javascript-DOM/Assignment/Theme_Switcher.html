<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Theme Switcher</title>
<style>
body[data-theme="light"]{background:white;color:black}body[data-theme="dark"]{background:#222;color:white}
body[data-theme="blue"]{background:#dbeafe;color:#123}
</style></head>
<body data-theme="light"><h2>Theme Switcher</h2>
<button data-theme="light">Light</button><button data-theme="dark">Dark</button><button data-theme="blue">Blue</button>
<script>
document.querySelectorAll("button").forEach(button=>button.onclick=()=>{
    const theme=button.dataset.theme;
    document.body.setAttribute("data-theme",theme);
    document.body.setAttribute("data-current-theme",theme);
});
</script></body></html>
